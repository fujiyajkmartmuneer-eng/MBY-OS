# Builds the MBY OS ISO on GitHub's servers.
# Actions tab -> "Build MBY OS ISO" -> Run workflow. Download the ISO from the run page when it finishes.
name: Build MBY OS ISO

on:
  workflow_dispatch:
  push:
    paths: ["mby-src-*.zip"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the MBY OS source
        run: |
          unzip -q mby-src-1.zip
          unzip -qo mby-src-2.zip
          ls MBY-OS/build-iso

      - name: Free disk space (the build needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Build the ISO inside Debian 12
        run: |
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE/MBY-OS":/mby -w /mby/build-iso \
            debian:bookworm bash -c "apt-get update && apt-get -y install ca-certificates && bash build.sh"

      - name: Show result
        run: ls -lh MBY-OS/build-iso/work/*.iso* && cat MBY-OS/build-iso/work/MBY-OS-amd64.iso.sha256

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: MBY-OS-amd64-iso
          path: |
            MBY-OS/build-iso/work/MBY-OS-amd64.iso
            MBY-OS/build-iso/work/MBY-OS-amd64.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Upload the build log (always, for checking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            MBY-OS/build-iso/work/build.log
            MBY-OS/build-iso/work/chroot/var/log/mby-missing-packages.log
          if-no-files-found: ignore
